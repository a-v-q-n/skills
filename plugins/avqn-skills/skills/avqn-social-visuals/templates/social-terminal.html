<!-- AVQN · GABARIT « Terminal / code » (nocturne, aperçu de lien).
 Cas d'usage : post technique (une commande, une recette n8n, une session Claude Code). Le code est le sujet.
 FIGÉ : ambiance nocturne (lueur + quadrillage + vignette) · colonne gauche = eyebrow + titre serif crème
   (fragment .acc) · colonne droite = fenêtre à barre (3 pastilles vermillon/gris/crème + nom mono) et corps
   Geist Mono crème, lueur vermillon douce (jamais d'ombre dure). UN seul accent vermillon.
 À REMPLACER : eyebrow, titre, nom de fenêtre (.fn), les lignes de code (.kw = accent, .cm = commentaire).
 FORMAT : 16:9 (1200×627). wait_for ~1500ms. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap');
:root{--W:1200px;--H:627px;--paper:#FAF8F3;--ink:#211C17;--red:#E0542B;--greyd:#CBC4BA;
  --serif:"Instrument Serif",serif;--sans:"Geist",sans-serif;--mono:"Geist Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
.c{position:relative;width:var(--W);height:var(--H);overflow:hidden;color:var(--paper);font-family:var(--serif);
  display:flex;align-items:center;gap:56px;padding:0 72px;
  background:radial-gradient(ellipse 70% 70% at 78% 50%,rgba(224,84,43,.20) 0%,rgba(224,84,43,.06) 45%,rgba(224,84,43,0) 74%),
            repeating-linear-gradient(0deg,rgba(250,248,243,.055) 0 1px,transparent 1px 120px),
            repeating-linear-gradient(90deg,rgba(250,248,243,.055) 0 1px,transparent 1px 120px),var(--ink)}
.c::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 82% 80% at 40% 50%,transparent 55%,rgba(0,0,0,.34) 100%)}
.left{position:relative;z-index:1;width:44%;flex:none}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--red);display:flex;align-items:center;gap:16px;line-height:1;margin-bottom:28px}
.eyebrow::before{content:"";width:14px;height:14px;background:var(--red);flex:none}
.title{font-weight:400;font-size:78px;line-height:1.02;letter-spacing:-.01em}
.acc{font-style:italic;color:var(--red)}
.win{position:relative;z-index:1;flex:1;background:#2A231D;border:1px solid rgba(250,248,243,.10);
  box-shadow:0 0 72px rgba(224,84,43,.14)}
.bar{display:flex;align-items:center;gap:11px;padding:16px 22px;border-bottom:1px solid rgba(250,248,243,.08)}
.dot{width:13px;height:13px;border-radius:50%}.d1{background:var(--red)}.d2{background:#6B6259}.d3{background:#CBC4BA}
.fn{margin-left:12px;font-family:var(--mono);font-size:19px;color:var(--greyd)}
.code{font-family:var(--mono);font-weight:400;font-size:23px;line-height:1.7;color:#EDE7DC;padding:28px 28px 30px}
.kw{color:var(--red)}.cm{color:#8A8177}
</style></head><body>
<div class="c">
  <div class="left">
    <div class="eyebrow">Recette n8n</div>
    <div class="title">Relancer un impayé,<br>sans y <span class="acc">penser.</span></div>
  </div>
  <div class="win">
    <div class="bar"><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="fn">relance-facture.json</div></div>
    <div class="code"><span class="cm"># chaque matin à 8h</span><br><span class="kw">Schedule</span> &rarr; <span class="kw">Postgres</span> (factures &gt; 30j)<br>&rarr; <span class="kw">Filter</span> (impayées)<br>&rarr; <span class="kw">Gmail</span> : relance polie, en CHF</div>
  </div>
</div>
</body></html>
