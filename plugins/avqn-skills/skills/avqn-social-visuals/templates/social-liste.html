<!-- AVQN · GABARIT « Liste » (clair).
 Cas d'usage : N étapes / N erreurs / N principes. L'énumération lisible.
 FIGÉ : ambiance papier quadrillé · eyebrow + titre serif (fragment .acc) · items = index mono vermillon +
   texte serif encre, séparés par des filets 1px · filet + appui de conclusion. UN seul accent vermillon.
 À REMPLACER : eyebrow, titre, les items (index .n + texte), la phrase d'appui.
 FORMAT : 4:5 (1080×1350) · suit aussi en 9:16. wait_for ~1500ms. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap');
:root{--W:1080px;--H:1350px;--paper:#FAF8F3;--ink:#211C17;--red:#E0542B;--grey:#7A726A;--filet:#E7E1D8;
  --serif:"Instrument Serif",serif;--sans:"Geist",sans-serif;--mono:"Geist Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
.c{position:relative;width:var(--W);height:var(--H);overflow:hidden;color:var(--ink);font-family:var(--serif);
  background:repeating-linear-gradient(0deg,rgba(33,28,23,.04) 0 1px,transparent 1px 46px),
            repeating-linear-gradient(90deg,rgba(33,28,23,.04) 0 1px,transparent 1px 46px),var(--paper)}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:100px 92px}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:32px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--red);display:flex;align-items:center;gap:18px;line-height:1}
.eyebrow::before{content:"";width:16px;height:16px;background:var(--red);flex:none}
.title{font-weight:400;font-size:104px;line-height:1.02;margin:34px 0 12px}
.acc{font-style:italic;color:var(--red)}
.list{flex:1;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;align-items:baseline;gap:34px;padding:30px 0}
.row+.row{border-top:1px solid var(--filet)}
.n{font-family:var(--mono);font-weight:600;font-size:34px;color:var(--red);flex:none;width:54px}
.it{font-size:56px;line-height:1.12}
footer{display:flex;flex-direction:column;gap:28px}
.rule{height:1px;background:var(--filet)}
.sub{font-family:var(--sans);font-weight:500;font-size:38px;line-height:1.4;color:var(--grey);max-width:92%}
.sub b{color:var(--ink);font-weight:600}
</style></head><body>
<div class="c">
  <div class="wrap">
    <div class="eyebrow">Prompt</div>
    <h1 class="title">Bien demander, en <span class="acc">4 gestes.</span></h1>
    <div class="list">
      <div class="row"><div class="n">01</div><div class="it">Donner le contexte avant la tâche</div></div>
      <div class="row"><div class="n">02</div><div class="it">Montrer un exemple de ce qu'on veut</div></div>
      <div class="row"><div class="n">03</div><div class="it">Dire le format de sortie attendu</div></div>
      <div class="row"><div class="n">04</div><div class="it">Corriger en une phrase, pas tout réécrire</div></div>
    </div>
    <footer>
      <div class="rule"></div>
      <p class="sub">Un bon prompt n'est pas plus long. Il est <b>plus clair</b>.</p>
    </footer>
  </div>
</div>
</body></html>
