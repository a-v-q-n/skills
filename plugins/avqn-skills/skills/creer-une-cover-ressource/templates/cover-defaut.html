<!-- AVQN · GABARIT « Cover ressource » (défaut : cours/tuto, nocturne + fenêtre code).
 Cas d'usage : la bannière 16:9 d'une ressource. L'accroche-objectif porte tout (voir SKILL.md).
 FIGÉ : ambiance nocturne (lueur + quadrillage + vignette) · composition diagonale (accroche
   haut-gauche, objet bas-droite) · eyebrow mono + filet vermillon · accroche Instrument Serif,
   UN seul fragment .acc (le mot-clé ou la durée) · fenêtre code NEUTRE (aucun vermillon dessus).
 À REMPLACER : eyebrow (catégorie réelle), accroche + son .acc, nom de commande et 2-4 lignes mono.
 MARGES DE SÉCURITÉ ~8% (la card recadre). FORMAT : 16:9 (1280×720). wait_for ~1600ms. -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap');
:root{
  --W:1280px; --H:720px;
  --paper:#FAF8F3; --ink:#211C17; --red:#E0542B;
  --grey:#7A726A; --greyd:#CBC4BA; --filet:#E7E1D8;
  --serif:"Instrument Serif",serif; --display:"Anton",sans-serif;
  --sans:"Geist",sans-serif; --mono:"Geist Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
.c{position:relative;width:var(--W);height:var(--H);overflow:hidden;font-family:var(--serif)}
.night{
  background:
    radial-gradient(ellipse 82% 44% at 34% 42%, rgba(224,84,43,.18) 0%, rgba(224,84,43,.06) 46%, rgba(224,84,43,0) 78%),
    repeating-linear-gradient(0deg, rgba(250,248,243,.055) 0 1px, transparent 1px 120px),
    repeating-linear-gradient(90deg, rgba(250,248,243,.055) 0 1px, transparent 1px 120px),
    var(--ink);
  color:var(--paper);
}
.night::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 78% 74% at 50% 44%, transparent 52%, rgba(0,0,0,.36) 100%);}
.pad{position:absolute;inset:0;padding:92px 104px}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:16px;line-height:1}
.eyebrow::before{content:"";width:14px;height:14px;background:var(--red);flex:none}
.filet{height:6px;width:120px;background:var(--red);margin:26px 0 30px}
.accroche{font-size:100px;line-height:1.03;max-width:700px;text-wrap:balance}
.acc{font-style:italic;color:var(--red)}
/* fenêtre code — objet neutre, bas-droite (aucun vermillon) */
.win{position:absolute;right:104px;bottom:92px;width:420px;
  border:1px solid rgba(250,248,243,.16);background:rgba(0,0,0,.30)}
.win .bar{display:flex;gap:10px;padding:15px 18px;border-bottom:1px solid rgba(250,248,243,.12)}
.win .bar i{width:12px;height:12px;background:rgba(250,248,243,.30);display:block}
.win .body{padding:20px 22px;font-family:var(--mono);font-size:19px;line-height:1.8;color:var(--greyd)}
.win .body .d{color:rgba(250,248,243,.42)}
</style></head>
<body>
<div class="c night">
  <div class="pad">
    <div class="eyebrow">Recette n8n</div>
    <div class="filet"></div>
    <div class="accroche">Automatiser sa veille avec n8n, <span class="acc">en 15 minutes</span>.</div>
  </div>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body">
      <div><span class="d">$</span> n8n start</div>
      <div><span class="d">▸</span> workflow : veille-rss</div>
      <div><span class="d">▸</span> trigger&nbsp;&nbsp;: cron 0 8 * * *</div>
    </div>
  </div>
</div>
</body></html>
