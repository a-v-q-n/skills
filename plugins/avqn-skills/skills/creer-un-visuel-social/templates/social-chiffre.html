<!-- AVQN · GABARIT « Chiffre » (clair, carré).
 Cas d'usage : un résultat chiffré brut — le chiffre fait le hook. Anton condensé pour l'impact.
 FIGÉ : ambiance papier quadrillé · eyebrow mono · chiffre géant Anton (encre) avec unité vermillon ·
   filet de séparation + appui de contexte. UN seul accent vermillon (l'unité).
 À REMPLACER : eyebrow, le chiffre (.num), l'unité (.unit), la phrase de contexte.
 FORMAT : 1:1 (1080×1080). wait_for ~1500ms. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap');
:root{--W:1080px;--H:1080px;--paper:#FAF8F3;--ink:#211C17;--red:#E0542B;--grey:#7A726A;--filet:#E7E1D8;
  --serif:"Instrument Serif",serif;--display:"Anton",sans-serif;--sans:"Geist",sans-serif;--mono:"Geist Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
.c{position:relative;width:var(--W);height:var(--H);overflow:hidden;color:var(--ink);font-family:var(--serif);
  background:repeating-linear-gradient(0deg,rgba(33,28,23,.04) 0 1px,transparent 1px 46px),
            repeating-linear-gradient(90deg,rgba(33,28,23,.04) 0 1px,transparent 1px 46px),var(--paper)}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:92px 88px}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:32px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--red);display:flex;align-items:center;gap:18px;line-height:1}
.eyebrow::before{content:"";width:16px;height:16px;background:var(--red);flex:none}
.big{flex:1;display:flex;align-items:center;gap:34px}
.num{font-family:var(--display);font-size:440px;line-height:.8;letter-spacing:-.02em}
.unit{font-family:var(--mono);font-weight:600;font-size:60px;color:var(--red);letter-spacing:.02em;align-self:flex-end;padding-bottom:64px}
footer{display:flex;flex-direction:column;gap:30px}
.rule{height:1px;background:var(--filet)}
.sub{font-family:var(--sans);font-weight:500;font-size:40px;line-height:1.4;color:var(--grey);max-width:92%}
.sub b{color:var(--ink);font-weight:600}
</style></head><body>
<div class="c">
  <div class="wrap">
    <div class="eyebrow">Retour d'expérience</div>
    <div class="big"><div class="num">9</div><div class="unit">h / sem</div></div>
    <footer>
      <div class="rule"></div>
      <p class="sub">C'est ce qu'un seul workflow n8n rend à une fiduciaire lausannoise, chaque semaine. <b>Une fois posé, plus personne n'y touche.</b></p>
    </footer>
  </div>
</div>
</body></html>
