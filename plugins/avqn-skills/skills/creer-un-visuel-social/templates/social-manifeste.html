<!-- AVQN · GABARIT « Manifeste » (nocturne, story).
 Cas d'usage : une idée forte posée sur l'encre, avec la lueur vermillon qui respire. Emphase maximale.
 FIGÉ : ambiance nocturne (lueur radiale + quadrillage crème + vignette) · eyebrow mono · hero serif crème
   centré avec UN fragment .acc (italique vermillon) · filet vermillon + appui de conclusion.
 À REMPLACER : eyebrow, les lignes du hero (retours à la main), le fragment .acc, la phrase d'appui.
 FORMAT : 9:16 (1080×1920). wait_for ~1500ms. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap');
:root{--W:1080px;--H:1920px;--paper:#FAF8F3;--ink:#211C17;--red:#E0542B;--greyd:#CBC4BA;
  --serif:"Instrument Serif",serif;--sans:"Geist",sans-serif;--mono:"Geist Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
.c{position:relative;width:var(--W);height:var(--H);overflow:hidden;color:var(--paper);font-family:var(--serif);
  background:radial-gradient(ellipse 82% 40% at 34% 40%,rgba(224,84,43,.20) 0%,rgba(224,84,43,.06) 46%,rgba(224,84,43,0) 78%),
            repeating-linear-gradient(0deg,rgba(250,248,243,.055) 0 1px,transparent 1px 120px),
            repeating-linear-gradient(90deg,rgba(250,248,243,.055) 0 1px,transparent 1px 120px),var(--ink)}
.c::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 78% 72% at 50% 42%,transparent 52%,rgba(0,0,0,.38) 100%)}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:130px 96px}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:38px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--red);display:flex;align-items:center;gap:22px;line-height:1;margin-bottom:64px}
.eyebrow::before{content:"";width:20px;height:20px;background:var(--red);flex:none}
.hero{font-weight:400;font-size:186px;line-height:1.0;letter-spacing:-.01em;text-wrap:balance}
.acc{font-style:italic;color:var(--red)}
.filet{height:6px;width:132px;background:var(--red);margin:78px 0 44px}
.sub{font-family:var(--sans);font-weight:500;font-size:46px;line-height:1.4;color:var(--greyd);max-width:80%}
</style></head><body>
<div class="c">
  <div class="wrap">
    <div class="eyebrow">Le vrai sujet</div>
    <h1 class="hero">Automatiser, ce n'est pas remplacer.<br>C'est <span class="acc">se déplacer.</span></h1>
    <div class="filet"></div>
    <p class="sub">Le travail ne disparaît pas : il se déplace là où il crée de la valeur — chez le client.</p>
  </div>
</div>
</body></html>
