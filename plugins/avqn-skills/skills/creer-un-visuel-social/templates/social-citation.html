<!-- AVQN · GABARIT « Citation » (nocturne).
 Cas d'usage : la parole de QUELQU'UN D'AUTRE (jamais l'opérateur — auto-citation = pompeux), posée sur l'encre.
 FIGÉ : ambiance nocturne (lueur + quadrillage + vignette) · guillemet serif vermillon XXL · citation serif
   italique crème · filet vermillon · attribution (nom Geist crème + rôle mono gris). UN seul accent vermillon.
 À REMPLACER : la citation, le nom (.name), le rôle (.role).
 FORMAT : 4:5 (1080×1350). wait_for ~1500ms. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap');
:root{--W:1080px;--H:1350px;--paper:#FAF8F3;--ink:#211C17;--red:#E0542B;--greyd:#CBC4BA;
  --serif:"Instrument Serif",serif;--sans:"Geist",sans-serif;--mono:"Geist Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
.c{position:relative;width:var(--W);height:var(--H);overflow:hidden;color:var(--paper);font-family:var(--serif);
  background:radial-gradient(ellipse 82% 44% at 34% 42%,rgba(224,84,43,.19) 0%,rgba(224,84,43,.06) 46%,rgba(224,84,43,0) 78%),
            repeating-linear-gradient(0deg,rgba(250,248,243,.055) 0 1px,transparent 1px 120px),
            repeating-linear-gradient(90deg,rgba(250,248,243,.055) 0 1px,transparent 1px 120px),var(--ink)}
.c::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 78% 74% at 50% 44%,transparent 52%,rgba(0,0,0,.36) 100%)}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:center;padding:110px 96px}
.mark{font-family:var(--serif);font-size:280px;line-height:.6;color:var(--red);margin-bottom:6px}
.quote{font-style:italic;font-weight:400;font-size:104px;line-height:1.1;text-wrap:balance}
.filet{height:6px;width:120px;background:var(--red);margin:72px 0 40px}
.name{font-family:var(--sans);font-weight:600;font-size:46px;color:var(--paper)}
.role{font-family:var(--mono);font-weight:500;font-size:32px;letter-spacing:.08em;color:var(--greyd);margin-top:14px}
</style></head><body>
<div class="c">
  <div class="wrap">
    <div class="mark">«</div>
    <div class="quote">La plupart des gens surestiment ce que l'IA fait en un an, et sous-estiment ce qu'elle fait en dix.</div>
    <div class="filet"></div>
    <div class="name">Dario Amodei</div>
    <div class="role">CEO · Anthropic</div>
  </div>
</div>
</body></html>
