<!-- AVQN · GABARIT « Image éditoriale » (clair, image IA hero).
 Cas d'usage : une image générée « anticipation douce » en grand, surmontée d'un titre serif. L'image porte
   le propos (voir la direction image IA du socle produire-un-visuel-avqn), les mots vivent dans la mise en page.
 FIGÉ : image plein cadre en haut (duotone chaud léger via filtre) · bloc papier en bas : eyebrow + titre serif
   (fragment .acc) + appui. UN seul accent vermillon (dans le titre ; l'objet vermillon vit dans l'image).
 À REMPLACER : l'URL de l'image (<img src>, générée via media_generate_image), eyebrow, titre, .acc, appui.
   Le PLACEHOLDER ci-dessous (.ph, dégradé chaud) sert au calage — le remplacer par la vraie image.
 FORMAT : 4:5 (1080×1350). wait_for ~2600ms si l'image est distante (laisser charger). -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap');
:root{--W:1080px;--H:1350px;--paper:#FAF8F3;--ink:#211C17;--red:#E0542B;--grey:#7A726A;--filet:#E7E1D8;
  --serif:"Instrument Serif",serif;--sans:"Geist",sans-serif;--mono:"Geist Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
.c{position:relative;width:var(--W);height:var(--H);overflow:hidden;color:var(--ink);font-family:var(--serif);
  background:repeating-linear-gradient(0deg,rgba(33,28,23,.04) 0 1px,transparent 1px 46px),
            repeating-linear-gradient(90deg,rgba(33,28,23,.04) 0 1px,transparent 1px 46px),var(--paper);
  display:flex;flex-direction:column}
.media{position:relative;height:62%;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.02)}
.media .grade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(33,28,23,.08) 0%,transparent 22%,transparent 72%,rgba(250,248,243,.9) 100%)}
/* placeholder de calage (à remplacer par la vraie image) */
.ph{width:100%;height:100%;
  background:radial-gradient(120% 90% at 30% 20%,#C89B5A 0%,#8C6A4A 40%,#3A2E24 100%)}
.foot{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 92px 96px}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:32px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--red);display:flex;align-items:center;gap:18px;line-height:1;margin-bottom:26px}
.eyebrow::before{content:"";width:16px;height:16px;background:var(--red);flex:none}
.title{font-weight:400;font-size:110px;line-height:1.0;letter-spacing:-.01em}
.acc{font-style:italic;color:var(--red)}
.sub{font-family:var(--sans);font-weight:500;font-size:38px;line-height:1.4;color:var(--grey);max-width:88%;margin-top:34px}
</style></head><body>
<div class="c">
  <div class="media">
    <!-- <img src="URL_IMAGE_GENEREE"> -->
    <div class="ph"></div>
    <div class="grade"></div>
  </div>
  <div class="foot">
    <div class="eyebrow">Automatisation</div>
    <div class="title">Ce qui me prenait une semaine sort en <span class="acc">quelques minutes.</span></div>
    <p class="sub">Le répétitif n'a plus besoin de toi. Il tourne pendant que tu es chez le client.</p>
  </div>
</div>
</body></html>
