<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Geist:wght@400;500;600&display=swap');
  :root{
    --W:1600px; --H:900px;
    --paper:#FAF8F3; --ink:#211C17; --red:#E0542B;
    --grey:#7A726A; --filet:#E7E1D8;
    --sans:"Geist",sans-serif; --mono:"Geist Mono",monospace;
    --r:6px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  .c{width:var(--W);height:var(--H);position:relative;font-family:var(--sans);
    background:
      repeating-linear-gradient(0deg, rgba(33,28,23,.03) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(33,28,23,.03) 0 1px, transparent 1px 46px),
      var(--paper);
    display:flex;align-items:center;justify-content:center}
  .stage{position:relative}
  /* La fausse UI : une fenêtre posée sur le papier */
  .ui{width:1160px;height:620px;background:#FFFFFF;border:1.5px solid var(--ink);
    border-radius:var(--r);display:flex;overflow:hidden;position:relative}
  /* Structure neutre : tout recule */
  .pane{border-right:1px solid var(--filet)}
  .row{border-bottom:1px solid var(--filet)}
  .label{color:var(--grey);font-size:22px}
  .strong{color:var(--ink);font-size:24px;font-weight:500}
  .ghost{height:16px;background:var(--filet);border-radius:3px}
  .eyebrow-ui{font-family:var(--mono);font-weight:600;font-size:15px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--grey)}
  .btn{display:inline-flex;align-items:center;justify-content:center;
    border:1.5px solid var(--ink);border-radius:4px;padding:12px 24px;
    font-size:21px;font-weight:500;color:var(--ink);background:#fff}
  .btn--primary{background:var(--ink);color:var(--paper)}
  /* L'élément enseigné : le seul vermillon */
  .focus{outline:3px solid var(--red);outline-offset:-3px}
  .annot{position:absolute;font-family:var(--mono);font-weight:600;font-size:28px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--red);
    display:flex;align-items:center;gap:14px;white-space:nowrap}
  .annot::before{content:"";width:12px;height:12px;background:var(--red);flex:none}
  .tick{position:absolute;width:2px;background:var(--red)}
</style></head>
<body><div class="c">
  <div class="stage">
    <!-- .annot + .tick + .ui de la maquette -->
  </div>
</div></body></html>
