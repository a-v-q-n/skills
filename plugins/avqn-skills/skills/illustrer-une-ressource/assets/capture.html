<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gabarit capture annotée — enrichir une capture d'écran</title>
<!-- Mode 3 : capture annotée. Le viewport = la taille de la capture (ici 1594×1584), la capture en fond, les annotations posées en px par-dessus.
     Vocabulaire : .cadre (ce qu'il faut voir), .numero (l'ordre des gestes), .fleche (un geste, un mouvement), .texte (un mot, jamais une phrase), .masque (cacher une donnée).
     Repérage : mettre .grille en display:block pour un premier rendu, lire les coordonnées, puis la remettre en display:none pour le rendu final. -->
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;width:1594px;height:1584px;overflow:hidden;font-family:"Schibsted Grotesk",system-ui,sans-serif}
  .scene{position:relative;width:1594px;height:1584px}
  .scene>img{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* ce qu'il faut voir */
  .cadre{position:absolute;border:5px solid #E8763A;border-radius:10px;box-shadow:0 0 0 4px rgba(251,248,241,.9)}
  /* l'ordre des gestes */
  .numero{position:absolute;width:54px;height:54px;border-radius:50%;background:#E8763A;color:#FBF8F1;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(251,248,241,.9),0 6px 18px rgba(22,35,63,.25)}
  /* un mot posé à côté */
  .texte{position:absolute;font-weight:700;font-size:26px;color:#16233F;background:#FBF8F1;border-left:6px solid #E8763A;padding:10px 18px;border-radius:6px;box-shadow:0 6px 18px rgba(22,35,63,.18);white-space:nowrap}
  /* cacher une donnée personnelle */
  .masque{position:absolute;background:#E9E2D3;border-radius:6px}
  /* un geste, un mouvement : SVG plein cadre */
  svg.fleches{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  svg.fleches > path{fill:none;stroke:#E8763A;stroke-width:7;stroke-linecap:round;marker-end:url(#tete);filter:drop-shadow(0 0 3px rgba(251,248,241,.95))}
  svg.fleches marker path{fill:#E8763A;stroke:none}
  /* grille de repérage : block pour lire les coordonnées, none pour le rendu final */
  .grille{display:none;position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(201,91,126,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(201,91,126,.45) 1px,transparent 1px);
    background-size:100px 100px}
  .grille span{position:absolute;font:700 14px ui-monospace,Menlo,monospace;color:#C95B7E;background:rgba(251,248,241,.85);padding:1px 4px}
</style>
</head>
<body>
<div class="scene">
  <img src="https://pub-74fb9dd4284e45dab2396a5934108bd0.r2.dev/uploads/manu/uubf665w8dcr" alt="">

  <svg class="fleches" aria-hidden="true">
    <defs><marker id="tete" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#E8763A"/></marker></defs>
    <path d="M1180 1180 C 1230 1300, 1200 1380, 1215 1440"/>
  </svg>

  <div class="cadre" style="left:1318px;top:1022px;width:196px;height:96px"></div>
  <div class="numero" style="left:1246px;top:1042px">1</div>
  <div class="texte" style="left:900px;top:1040px">Add README sur On</div>

  <div class="cadre" style="left:1224px;top:1440px;width:300px;height:86px"></div>
  <div class="numero" style="left:1152px;top:1456px">2</div>

  <div class="grille">
    <span style="left:100px;top:0">100</span><span style="left:300px;top:0">300</span><span style="left:500px;top:0">500</span><span style="left:700px;top:0">700</span><span style="left:900px;top:0">900</span><span style="left:1100px;top:0">1100</span><span style="left:1300px;top:0">1300</span><span style="left:1500px;top:0">1500</span>
    <span style="left:0;top:100px">100</span><span style="left:0;top:300px">300</span><span style="left:0;top:500px">500</span><span style="left:0;top:700px">700</span><span style="left:0;top:900px">900</span><span style="left:0;top:1100px">1100</span><span style="left:0;top:1300px">1300</span><span style="left:0;top:1500px">1500</span>
  </div>
</div>
</body>
</html>
